name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate visual baselines (uploaded as the "visual-baselines" artifact)'
        type: boolean
        default: false
      browsers:
        description: 'Comma separated: chrome,firefox,webkit'
        type: string
        default: 'chrome'

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'auto' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      BROWSERS: ${{ inputs.browsers || 'chrome' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Real Google Chrome: the site's bot protection rejects Playwright's bundled headless Chromium.
      - name: Install browsers
        run: |
          npx playwright install --with-deps chrome
          if [[ "$BROWSERS" == *firefox* ]]; then npx playwright install --with-deps firefox; fi
          if [[ "$BROWSERS" == *webkit* ]]; then npx playwright install --with-deps webkit; fi

      - name: Type check
        run: npm run typecheck

      - name: Run tests (headless)
        run: npx playwright test ${{ inputs.update_snapshots && '--update-snapshots' || '' }}

      - name: Upload visual baselines
        if: inputs.update_snapshots && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: tests/visual.spec.ts-snapshots/
          if-no-files-found: warn

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload failure artifacts (screenshots, traces)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
